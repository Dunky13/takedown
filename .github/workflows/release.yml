name: Release and nightly

on:
  workflow_run:
    workflows: [Native CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump from the highest stable tag on main
        type: choice
        required: true
        default: patch
        options: [patch, minor, major, custom]
      custom_version:
        description: Custom SemVer without v (custom only)
        type: string
        required: false
  schedule:
    - cron: '23 2 * * *'
    - cron: '*/20 * * * *'

env:
  RELEASE_AUTOMATION_SHA: ${{ github.sha }}
  RELEASE_WORKFLOW_SHA: ${{ github.sha }}

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # GitHub draft discovery requires push access. This job has no Apple inputs.
      contents: write
      actions: read
      checks: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      package_version: ${{ steps.plan.outputs.package_version }}
      sha: ${{ steps.plan.outputs.sha }}
      skip: ${{ steps.plan.outputs.skip }}
      resume: ${{ steps.plan.outputs.resume }}
      state_tag: ${{ steps.plan.outputs.state_tag }}
      origin_run: ${{ steps.plan.outputs.origin_run }}
      origin_attempt: ${{ steps.plan.outputs.origin_attempt }}
      channel: ${{ steps.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          check-latest: false
          cache: false
      - name: Resume original candidate or plan eligible trusted main
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          TRIGGER_SOURCE: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          TRIGGER_PATH: ${{ github.event.workflow_run.path }}
          CONTINUATION_ONLY: ${{ github.event_name == 'schedule' && github.event.schedule != '23 2 * * *' }}
          BUMP: ${{ inputs.bump || 'patch' }}
          CUSTOM: ${{ inputs.custom_version }}
          PLAN_DIR: ${{ runner.temp }}/release-plan
        run: bash scripts/prepare-apple-release.sh plan
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.plan.outputs.skip == 'false'
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan/
          if-no-files-found: error
          retention-days: 7

  native:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false' && needs.prepare.outputs.resume == 'false'
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.prepare.outputs.sha }}
      package_version: ${{ needs.prepare.outputs.package_version }}
      release_version: ${{ needs.prepare.outputs.version }}

  custody:
    needs: [prepare, native]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.skip == 'false' &&
      (needs.native.result == 'success' || (needs.prepare.outputs.resume == 'true' && needs.native.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release_id: ${{ steps.persist.outputs.release_id }}
      release_body_sha256: ${{ steps.persist.outputs.release_body_sha256 }}
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-plan
          path: .local/release-plan
      - name: Persist exact credential-free build before any Apple operation
        id: persist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTARY_STATE_TAG: ${{ needs.prepare.outputs.state_tag }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          PLAN_DIR: .local/release-plan
          ORIGIN_RUN: ${{ needs.prepare.outputs.origin_run }}
          ORIGIN_ATTEMPT: ${{ needs.prepare.outputs.origin_attempt }}
        run: env GITHUB_RUN_ID="$ORIGIN_RUN" GITHUB_RUN_ATTEMPT="$ORIGIN_ATTEMPT" bash scripts/prepare-apple-release.sh persist

  macos:
    needs: [prepare, native, custody]
    if: >-
      always() && needs.prepare.outputs.skip == 'false' &&
      needs.custody.result == 'success'
    permissions:
      contents: write
      actions: read
      checks: read
    uses: ./.github/workflows/release-macos.yml
    secrets:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    with:
      checkout_ref: ${{ needs.prepare.outputs.sha }}
      automation_ref: ${{ github.sha }}
      release_id: ${{ needs.custody.outputs.release_id }}
      release_body_sha256: ${{ needs.custody.outputs.release_body_sha256 }}
      package_version: ${{ needs.prepare.outputs.package_version }}
      release_version: ${{ needs.prepare.outputs.version }}
      state_tag: ${{ needs.prepare.outputs.state_tag }}
      origin_run: ${{ needs.prepare.outputs.origin_run }}
      origin_attempt: ${{ needs.prepare.outputs.origin_attempt }}

  publish:
    needs: [prepare, custody, macos]
    if: "!cancelled() && needs.prepare.result == 'success' && needs.macos.result == 'success' && needs.macos.outputs.ready == 'true'"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          check-latest: false
          cache: false
      - name: Restore complete original candidate and publish exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTARY_RELEASE_ID: ${{ needs.custody.outputs.release_id }}
          NOTARY_RELEASE_BODY_SHA256: ${{ needs.custody.outputs.release_body_sha256 }}
          NOTARY_RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          NOTARY_STATE_TAG: ${{ needs.prepare.outputs.state_tag }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          ORIGIN_RUN: ${{ needs.prepare.outputs.origin_run }}
          ORIGIN_ATTEMPT: ${{ needs.prepare.outputs.origin_attempt }}
        run: bash scripts/promote-apple-release.sh
