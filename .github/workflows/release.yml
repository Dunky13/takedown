name: Release and nightly

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump from the highest stable tag on main
        type: choice
        required: true
        default: patch
        options: [patch, minor, major, custom]
      custom_version:
        description: 'Custom SemVer without v (custom only), e.g. 1.2.0-rc.1'
        type: string
        required: false
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

# Serialize planning through publication across both channels. Never cancel an
# active release while signing or uploading assets.
concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      package_version: ${{ steps.plan.outputs.package_version }}
      sha: ${{ steps.plan.outputs.sha }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - name: Require main and preserve the stable signing boundary
        env:
          SOURCE_REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          PROTECTED: ${{ github.ref_protected }}
        run: |
          [[ $SOURCE_REF == refs/heads/main ]] || { echo 'Releases must run from main' >&2; exit 1; }
          if [[ $EVENT == workflow_dispatch && $PROTECTED != true ]]; then
            echo 'Protect main before publishing signed releases; signing policy is unchanged' >&2
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          check-latest: false
          cache: false
      - name: Select version and generate Conventional Commit release notes
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BUMP: ${{ inputs.bump }}
          CUSTOM: ${{ inputs.custom_version }}
        run: |
          kind=$BUMP
          last=''
          if [[ $EVENT == schedule ]]; then
            kind=nightly
            # Drafts and unrelated prereleases never advance the nightly marker.
            # API failures must fail planning, rather than masquerade as no nightly.
            gh api --paginate "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
            last=$(bash scripts/select-last-nightly.sh "$RUNNER_TEMP/releases.json")
          fi
          go run -mod=readonly -p 2 ./cmd/releasectl plan --kind "$kind" --custom "$CUSTOM" --last-nightly "$last" --output "$RUNNER_TEMP/release-plan"
          cat "$RUNNER_TEMP/release-plan/github-output" >> "$GITHUB_OUTPUT"
          if grep -qx 'skip=true' "$RUNNER_TEMP/release-plan/github-output"; then
            echo '### Nightly skipped: main has not changed since the last published nightly.' >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$RUNNER_TEMP/release-plan/notes.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.plan.outputs.skip == 'false'
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan/
          if-no-files-found: error
          retention-days: 7

  native:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.prepare.outputs.sha }}
      package_version: ${{ needs.prepare.outputs.package_version }}
      release_version: ${{ needs.prepare.outputs.version }}

  macos:
    needs: [prepare, native]
    if: needs.prepare.outputs.skip == 'false' && github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/release-macos.yml
    # Explicit forwarding enables environment secret resolution in the called
    # workflow. Only the approved release-signing job receives these values.
    secrets:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    with:
      checkout_ref: ${{ needs.prepare.outputs.sha }}
      package_version: ${{ needs.prepare.outputs.package_version }}
      release_version: ${{ needs.prepare.outputs.version }}

  publish:
    needs: [prepare, native, macos]
    if: >-
      always() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.skip == 'false' && needs.native.result == 'success' &&
      ((github.event_name == 'schedule' && needs.macos.result == 'skipped') ||
       (github.event_name == 'workflow_dispatch' && needs.macos.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          check-latest: false
          cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-plan
          path: .local/release-plan
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: '*-native-*'
          path: .local/release-artifacts
      - name: Verify all assets, create tag, and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_CHANNEL: ${{ github.event_name == 'schedule' && 'nightly' || 'manual' }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: bash scripts/publish-release.sh .local/release-plan .local/release-artifacts
